spring:
  config:
    import: optional:configserver:http://localhost:8888,optional:file:.env[.properties]

  application:
    name: admin-service

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope:
              - email
              - profile

  thymeleaf:
    cache: false

  devtools:
    restart:
      enabled: true
      exclude: static/**,public/**,templates/**
    livereload:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mbhoni_es?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Password12345}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      # Flyway owns schema initialization. The legacy schema.sql is retained
      # only as historical reference and is no longer executed at startup.
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing databases without flyway_schema_history are baselined at 0,
    # allowing the idempotent V1 baseline migration to run safely.
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      # Retained temporarily for legacy schemas. Set JPA_DDL_AUTO=validate in
      # production after the live schema has been reconciled to Flyway.
      ddl-auto: ${JPA_DDL_AUTO:update}
    defer-datasource-initialization: false
    open-in-view: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:noreply@mbhoni-es.com}

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    health-check-url-path: /actuator/health
    status-page-url-path: /actuator/info

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    initial-instance-info-replication-interval-seconds: 5

  server:
    peer-node-read-timeout-ms: 10000
    peer-node-connect-timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  admin-email: ${APP_ADMIN_EMAIL:}
  lifecycle:
    trial-days: ${TENANT_TRIAL_DAYS:14}
    payment-grace-days: ${TENANT_PAYMENT_GRACE_DAYS:7}
    suspended-grace-days: ${TENANT_SUSPENDED_GRACE_DAYS:7}
    retention-days: ${TENANT_EXPORT_RETENTION_DAYS:30}
    reconcile-ms: ${TENANT_RECONCILE_MS:60000}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    portal-return-url: ${STRIPE_PORTAL_RETURN_URL:}
    portal-configuration: ${STRIPE_PORTAL_CONFIGURATION:}
    # Supply case-sensitive price-plans mappings in deployment configuration, e.g.
    # price-plans:
    #   price_ABC123: STANDARD
  bootstrap:
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

server:
  port: 8080
  servlet:
    session:
      persistent: false
