spring:
  config:
    import: optional:configserver:http://localhost:8888

  application:
    name: admin-service

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope:
              - email
              - profile

  thymeleaf:
    cache: false

  devtools:
    restart:
      enabled: true
      exclude: static/**,public/**,templates/**
    livereload:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/mbhoni_es?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: Password@12345
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: creativembhoni@gmail.com
    password: aasx npth cgst ykun
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: noreply@mbhoni-es.com

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    health-check-url-path: /actuator/health
    status-page-url-path: /actuator/info

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    initial-instance-info-replication-interval-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  admin-email: creativembhoni@gmail.com

server:
  port: 8080
