<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Tenant Customizations')}"></head>

<body>
<div class="admin-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="admin-main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <main class="admin-content">
            <div th:if="${successMessage}" class="alert alert-success admin-alert">
                <i class="bi bi-check-circle"></i>
                <span th:text="${successMessage}">Success message</span>
            </div>

            <section class="page-heading">
                <div>
                    <p class="eyebrow">Tenant Settings</p>
                    <h2>Customizations</h2>
                    <p class="text-muted mb-0">Select a tenant to manage branding and experience settings.</p>
                </div>
            </section>

            <section class="data-panel">
                <div class="table-responsive">
                    <table class="table align-middle mb-0 admin-table">
                        <thead>
                        <tr>
                            <th>Tenant</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="tenant : ${tenants}">
                            <td>
                                <div class="entity-cell">
                                    <span class="entity-icon blue">
                                        <i class="bi bi-palette"></i>
                                    </span>
                                    <div>
                                        <strong th:text="${tenant.name}">Tenant</strong>
                                        <small>Branding and display settings</small>
                                    </div>
                                </div>
                            </td>

                            <td>
                                <span th:if="${tenant.active}" class="status-pill active">Active</span>
                                <span th:unless="${tenant.active}" class="status-pill inactive">Inactive</span>
                            </td>

                            <td class="text-end">
                                <form th:action="@{/customizations/edit}" method="post" class="d-inline">
                                    <input type="hidden" name="tenantId" th:value="${tenant.id}">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary">
                                        <i class="bi bi-pencil"></i>
                                        Customize
                                    </button>
                                </form>
                            </td>
                        </tr>

                        <tr th:if="${tenants == null or #lists.isEmpty(tenants)}">
                            <td colspan="3">
                                <div class="empty-state">
                                    <i class="bi bi-palette"></i>
                                    <strong>No tenants found</strong>
                                    <span>Create tenants before configuring branding.</span>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
