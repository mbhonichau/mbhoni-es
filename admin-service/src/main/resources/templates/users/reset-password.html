<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Reset Password')}"></head>

<body>
<div class="admin-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="admin-main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <main class="admin-content">
            <section class="page-heading">
                <div>
                    <p class="eyebrow">User Management</p>
                    <h2>Reset Password</h2>
                    <p class="text-muted mb-0">
                        Updating password for
                        <strong th:text="${user.username}">username</strong>
                    </p>
                </div>

                <a th:href="@{/users}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i>
                    Back
                </a>
            </section>

            <section class="form-panel narrow-panel">
                <form th:action="@{/users/reset-password/update}" method="post" id="resetForm">
                    <input type="hidden" name="id" th:value="${user.id}">

                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password"
                               name="password"
                               id="password"
                               class="form-control"
                               required
                               minlength="6">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm New Password</label>
                        <input type="password"
                               id="confirmPassword"
                               class="form-control"
                               required
                               minlength="6">
                        <div id="passwordError" class="text-danger small mt-1 d-none">
                            Passwords do not match.
                        </div>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/users}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-key"></i>
                            Update Password
                        </button>
                    </div>
                </form>
            </section>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>

<script>
    document.getElementById('resetForm').addEventListener('submit', function(e) {
        const pass = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        const error = document.getElementById('passwordError');

        if (pass !== confirm) {
            e.preventDefault();
            error.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
