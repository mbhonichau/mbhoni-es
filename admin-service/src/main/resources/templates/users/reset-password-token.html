<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set Your Password - MBHONI Creative Enterprise</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            background: #171a12;
            color: #dfddd1;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .login-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(38, 42, 29, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 42px;
            border-radius: var(--radius-lg);
            border: 1.5px solid rgba(227, 168, 87, 0.35);
            width: 90%;
            max-width: 460px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5), inset 0 0 40px rgba(223, 221, 209, 0.06);
            z-index: 10;
            animation: glowPulse 3.5s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 10px 40px rgba(113, 53, 25, 0.35), inset 0 0 40px rgba(223, 221, 209, 0.05); }
            50% { box-shadow: 0 15px 65px rgba(113, 53, 25, 0.55), inset 0 0 60px rgba(223, 221, 209, 0.12); }
        }

        .brand-logo {
            transition: transform 0.2s ease;
            filter: brightness(0) invert(1);
        }

        .brand:hover .brand-logo {
            transform: scale(1.05);
        }

        .brand-text {
            display: block;
            font-weight: 800;
            letter-spacing: .05em;
            font-size: 1.2rem;
            color: #ffffff;
        }

        .brand-copy small {
            display: block;
            color: #dfddd1;
            font-size: 0.75rem;
            font-weight: 600;
            opacity: 0.85;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #E3A857;
            font-size: 0.72rem;
            margin-bottom: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .form-group input {
            width: 100%;
            padding: 10px 40px 10px 14px;
            height: 42px;
            background: rgba(223, 221, 209, 0.1);
            border: 1px solid rgba(223, 221, 209, 0.25);
            border-radius: var(--radius-sm);
            color: #ffffff;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            background: rgba(223, 221, 209, 0.22);
            border-color: #ffffff !important;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4) !important;
        }

        .form-group input::placeholder {
            color: rgba(223, 221, 209, 0.5);
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(223, 221, 209, 0.75);
            cursor: pointer;
            z-index: 5;
            font-size: 1.1rem;
            transition: color 0.2s ease;
        }

        .password-toggle-btn:hover {
            color: #ffffff;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            height: 44px;
            background: linear-gradient(135deg, #713519 0%, #a64722 100%);
            border: 1px solid #713519;
            border-radius: var(--radius-sm);
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            box-shadow: 0 4px 12px rgba(113, 53, 25, 0.35);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #853d1d 0%, #b85026 100%);
            box-shadow: 0 6px 18px rgba(113, 53, 25, 0.55);
        }

        .login-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>

<body>
<canvas id="canvas"></canvas>

<div class="login-container text-center">
    <div class="brand d-flex align-items-center justify-content-center gap-2 mb-4">
        <img th:src="@{/images/logo.png}" alt="Mbhoni Creative" class="brand-logo" style="height: auto; width: 46px; object-fit: cover;">
        <span class="brand-copy text-start">
            <span class="brand-text fw-bold text-white fs-3 d-block" style="letter-spacing: 1.5px; line-height: 1.1;">MBHONI</span>
            <small class="d-block text-grey" style="font-size: 0.68rem; margin-left: -15px; color: #dfddd1; opacity: 0.85; text-transform: uppercase;">Creative Enterprise -----------</small>
        </span>
    </div>

    <form th:action="@{/users/reset-password/token}" method="post" id="resetForm">
        <input type="hidden" name="token" th:value="${token}">

        <div class="form-group">
            <label for="password">New Password</label>
            <div class="position-relative">
                <input type="password" name="password" id="password" placeholder="Enter new password (min 6 chars)" required minlength="6">
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibilityInline(this)" title="Show/Hide Password">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <div class="position-relative">
                <input type="password" id="confirmPassword" placeholder="Confirm your new password" required minlength="6">
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibilityInline(this)" title="Show/Hide Password">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
            <div id="passwordError" class="text-danger small mt-2 d-none" style="font-size: 0.85rem;">
                <i class="bi bi-exclamation-circle me-1"></i> Passwords do not match.
            </div>
        </div>

        <button type="submit" class="login-btn"><i class="bi bi-key me-1"></i> Set New Password</button>
    </form>

    <div class="login-footer d-flex align-items-center justify-content-between pt-3 mt-4 border-top border-secondary border-opacity-25" style="font-size: 0.78rem; color: #dfddd1; opacity: 0.8;">
        <div class="d-flex align-items-center gap-2">
            <img th:src="@{/images/logo.png}" alt="Mbhoni Creative" style="height: 16px; width: 16px; border-radius: 3px; object-fit: cover;">
            <span>MBHONI Creative Enterprise Solutions &copy; 2026</span>
        </div>
        <span>v1.0.0</span>
    </div>
</div>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script>
    function togglePasswordVisibilityInline(btn) {
        const input = btn.previousElementSibling;
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash text-warning';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }

    document.getElementById('resetForm').addEventListener('submit', function(e) {
        const pass = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        const error = document.getElementById('passwordError');

        if (pass !== confirm) {
            e.preventDefault();
            error.classList.remove('d-none');
        }
    });
</script>

<!-- Three.js 3D Canvas Background Engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true, alpha: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x171a12);
    renderer.shadowMap.enabled = true;
    camera.position.z = 25;

    const tubeGroup = new THREE.Group();
    scene.add(tubeGroup);

    function createTubeRing(radius, depth, rotation = 0) {
        const points = [];
        const segments = 64;

        for (let i = 0; i < segments; i++) {
            const angle = (i / segments) * Math.PI * 2;
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;
            points.push(new THREE.Vector3(x, y, 0));
        }
        points.push(points[0]);

        const curve = new THREE.CatmullRomCurve3(points);
        const tubeGeometry = new THREE.TubeGeometry(curve, segments, 0.8, 8, true);

        const material = new THREE.MeshPhongMaterial({
            color: new THREE.Color(i % 2 === 0 ? 0x713519 : 0x454f2c),
            emissive: new THREE.Color(i % 2 === 0 ? 0x3d1c0d : 0x242a17),
            shininess: 90,
            wireframe: false
        });

        const tube = new THREE.Mesh(tubeGeometry, material);
        tube.castShadow = true;
        tube.receiveShadow = true;
        tube.position.z = depth;
        tube.rotation.z = rotation;

        return tube;
    }

    for (let i = 0; i < 15; i++) {
        const tube = createTubeRing(8 + i * 1.5, -50 + i * 7, i * 0.1);
        tubeGroup.add(tube);
    }

    const particleGroup = new THREE.Group();
    scene.add(particleGroup);

    const particleGeometry = new THREE.IcosahedronGeometry(0.3, 2);

    for (let i = 0; i < 300; i++) {
        const isRust = Math.random() > 0.5;
        const material = new THREE.MeshPhongMaterial({
            color: new THREE.Color(isRust ? 0x713519 : 0x454f2c),
            emissive: new THREE.Color(isRust ? 0x4a2310 : 0x2b321c),
            shininess: 80
        });

        const particle = new THREE.Mesh(particleGeometry, material);
        const angle = Math.random() * Math.PI * 2;
        const radius = 5 + Math.random() * 8;

        particle.position.set(
            Math.cos(angle) * radius,
            Math.sin(angle) * radius,
            -40 + Math.random() * 80
        );

        particle.scale.set(Math.random() * 0.6 + 0.3, Math.random() * 0.6 + 0.3, Math.random() * 0.6 + 0.3);
        particle.castShadow = true;
        particle.velocity = { z: Math.random() * 0.3 + 0.1 };

        particleGroup.add(particle);
    }

    const light1 = new THREE.PointLight(0x713519, 2.5, 200);
    light1.position.set(20, 20, 20);
    scene.add(light1);

    const light2 = new THREE.PointLight(0x454f2c, 2.5, 200);
    light2.position.set(-20, -20, 20);
    scene.add(light2);

    const light3 = new THREE.PointLight(0xdfddd1, 1.8, 150);
    light3.position.set(0, 30, -30);
    scene.add(light3);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    let mouseX = 0;
    let mouseY = 0;
    document.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    let time = 0;

    function animate() {
        requestAnimationFrame(animate);
        time += 0.001;

        tubeGroup.rotation.z += 0.0005;
        tubeGroup.position.z += 0.05;
        if (tubeGroup.position.z > 100) tubeGroup.position.z = -100;

        particleGroup.children.forEach((particle) => {
            particle.position.z += particle.velocity.z;
            particle.rotation.x += 0.005;
            particle.rotation.y += 0.008;

            if (particle.position.z > 50) {
                particle.position.z = -100;
            }
        });

        light1.position.x = 20 + Math.sin(time * 2) * 10;
        light1.position.y = 20 + Math.cos(time * 1.5) * 10;

        light2.position.x = -20 + Math.cos(time * 1.8) * 10;
        light2.position.y = -20 + Math.sin(time * 2.2) * 10;

        camera.position.x += (mouseX * 3 - camera.position.x) * 0.08;
        camera.position.y += (mouseY * 3 - camera.position.y) * 0.08;
        camera.lookAt(0, 0, 0);

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
