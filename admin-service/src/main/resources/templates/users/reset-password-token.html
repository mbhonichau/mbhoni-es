<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Set Your Password')}"></head>

<body>
<div class="admin-shell">
    <div class="admin-main">
        <main class="admin-content">
            <section class="page-heading">
                <div>
                    <p class="eyebrow">Account Setup</p>
                    <h2>Set Your Password</h2>
                    <p class="text-muted mb-0">Please set a secure password for your account.</p>
                </div>
            </section>

            <section class="form-panel narrow-panel">
                <form th:action="@{/users/reset-password/token}" method="post" id="resetForm">
                    <input type="hidden" name="token" th:value="${token}">

                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password"
                               name="password"
                               id="password"
                               class="form-control"
                               required
                               minlength="6"
                               placeholder="Enter your new password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm New Password</label>
                        <input type="password"
                               id="confirmPassword"
                               class="form-control"
                               required
                               minlength="6"
                               placeholder="Confirm your new password">
                        <div id="passwordError" class="text-danger small mt-1 d-none">
                            Passwords do not match.
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-key"></i>
                            Set Password
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</div>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

<script>
    document.getElementById('resetForm').addEventListener('submit', function(e) {
        const pass = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        const error = document.getElementById('passwordError');

        if (pass !== confirm) {
            e.preventDefault();
            error.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
