<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
	  <link rel="stylesheet" th:href="@{/css/admin.css}">
	  
</head>

<body class="bg-light">

<div class="container py-5">
    <h1 class="text-center mb-4">Edit Tenant: [[${tenant.tenantId}]]</h1>

    <div th:if="${successMessage}" class="alert alert-success">
        [[${successMessage}]]
    </div>

    <form th:action="@{/tenants/edit/{tenantId}(tenantId=${tenant.tenantId})}" method="post">
        <div class="mb-3">
            <label class="form-label">Tenant ID (read-only)</label>
            <input type="text" class="form-control" th:value="${tenant.tenantId}" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Usage</label>
            <input type="text" name="usage" class="form-control" th:value="${tenant.usage}" required>
        </div>

        <div class="text-end">
            <a th:href="@{/tenants}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
