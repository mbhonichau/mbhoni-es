<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head('Tenants')}"></head>

<body>

<div class="app-layout">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Main wrapper -->
    <div class="main-wrapper">

        <!-- Navbar -->
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <!-- Page Content -->
        <div class="page-content">

            <section class="section">

                <div class="container">

                    <!-- Title -->
                    <div class="section-title text-center">
                        <h2>Administration</h2>
                        <p>Manage Tenants</p>
                    </div>

                    <!-- Messages -->
                    <div th:if="${successMessage}" class="alert alert-success">
                        [[${successMessage}]]
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger">
                        [[${errorMessage}]]
                    </div>

                    <!-- ================= ADD TENANT ================= -->
                    <div class="card shadow mb-5">

                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">Add New Tenant</h5>
                        </div>

                        <div class="card-body">

                            <form th:action="@{/tenants}" method="post">

                                <div class="row g-3">

                                    <div class="col-md-4">
                                        <label class="form-label">Tenant ID</label>
                                        <input type="text" name="tenantId"
                                               class="form-control" required
                                               placeholder="e.g. jusaqua">
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label">Initial Usage</label>
                                        <input type="text" name="usage"
                                               class="form-control" required
                                               placeholder="e.g. 150MB">
                                    </div>

                                    <div class="col-md-4 d-flex align-items-end">
                                        <button type="submit"
                                                class="btn btn-success w-100">
                                            Add Tenant
                                        </button>
                                    </div>

                                </div>

                            </form>

                        </div>
                    </div>

                    <!-- ================= TENANTS TABLE ================= -->
                    <div class="card shadow">

                        <div class="card-header bg-secondary text-white">
                            <h5 class="mb-0">Existing Tenants</h5>
                        </div>

                        <div class="card-body p-0">

                            <table class="table table-hover mb-0">

                                <thead class="table-light">
                                <tr>
                                    <th>Tenant ID</th>
                                    <th>Usage</th>
                                    <th>Last Updated</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                                </thead>

                                <tbody>

                                <tr th:each="tenant : ${tenants}">
                                    <td th:text="${tenant.tenantId}"></td>
                                    <td th:text="${tenant.usage}"></td>
                                    <td th:text="${tenant.timestamp}"></td>

                                    <td class="text-end">

                                        <a th:href="@{/tenants/edit/{tenantId}(tenantId=${tenant.tenantId})}"
                                           class="btn btn-sm btn-primary">
                                            Edit
                                        </a>

                                        <button type="button"
                                                class="btn btn-sm btn-danger delete-btn"
                                                data-bs-toggle="modal"
                                                data-bs-target="#deleteModal"
                                                th:attr="data-tenant-id=${tenant.tenantId}">
                                            Delete
                                        </button>

                                    </td>
                                </tr>

                                <tr th:if="${#lists.isEmpty(tenants)}">
                                    <td colspan="4" class="text-center text-muted py-4">
                                        No tenants found. Add one above.
                                    </td>
                                </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </section>

        </div>

        <!-- Footer -->
        <div th:replace="~{fragments/footer :: footer}"></div>

    </div>

</div>

<!-- ================= DELETE MODAL ================= -->
<div class="modal fade" id="deleteModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Confirm Delete</h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                Are you sure you want to delete tenant
                <strong id="tenantIdToDelete"></strong>?
            </div>

            <div class="modal-footer">

                <button class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Cancel
                </button>

                <form id="deleteForm" method="post">
                    <button type="submit"
                            class="btn btn-danger">
                        Delete Tenant
                    </button>
                </form>

            </div>

        </div>

    </div>

</div>

<script src="/js/sidebar.js"></script>

</body>
</html>
