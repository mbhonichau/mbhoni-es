<th:block xmlns:th="http://www.thymeleaf.org"
          th:fragment="sidebar">

<aside class="admin-sidebar">
    <a th:href="@{/dashboard}" class="brand d-flex align-items-center gap-2">
        <img th:src="@{/images/logo.png}" alt="Mbhoni Creative" class="brand-logo" style="height: auto; width: 46px; object-fit: cover;">
        <span class="brand-copy">
            <span class="brand-text fw-bold">MBHONI</span>
            <small class="d-block text-grey" style="font-size: 0.68rem; margin-left: -15px;">Creative Enterprise</small>
        </span>
    </a>

    <nav class="sidebar-nav" aria-label="Admin navigation">
        <section class="nav-section"
                 th:each="section, sectionStatus : ${sidebarSections}"
                 th:classappend="${section.active} ? ' open'">

            <button class="nav-section-toggle"
                    type="button"
                    th:attr="aria-expanded=${section.active}, aria-controls=${'nav-section-' + sectionStatus.index}">
                <span>
                    <i th:class="${'bi ' + section.icon}"></i>
                    <span th:text="${section.title}">Section</span>
                </span>
                <i class="bi bi-chevron-down"></i>
            </button>

            <div class="nav-section-items"
                 th:id="${'nav-section-' + sectionStatus.index}">
                <a th:each="item : ${section.items}"
                   th:href="@{${item.url}}"
                   class="nav-link"
                   th:classappend="${item.active} ? ' active'">
                    <i th:class="${'bi ' + item.icon}"></i>
                    <span th:text="${item.label}">Menu item</span>
                    <em th:if="${item.badge != null}" th:text="${item.badge}">New</em>
                </a>
            </div>
        </section>
    </nav>
</aside>

</th:block>
