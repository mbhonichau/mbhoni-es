<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Invoice #' + (${invoice != null ? invoice.invoiceNumber : 'Preview'})">Tax Invoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #1b1e15; }
        .invoice-card { background: #ffffff; border-radius: 12px; border: 1px solid #e8e6dc; max-width: 860px; margin: 40px auto; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .invoice-header { border-bottom: 2px solid #E3A857; padding-bottom: 24px; margin-bottom: 28px; }
        .brand-badge { background: linear-gradient(135deg, #1b1e15 0%, #262A1D 100%); color: #ffffff; padding: 6px 14px; border-radius: 6px; font-weight: 750; font-size: 0.85rem; letter-spacing: 0.05em; display: inline-block; }
        .invoice-title { font-size: 1.8rem; font-weight: 800; color: #262A1D; text-transform: uppercase; letter-spacing: 0.05em; }
        .table-invoice th { background: linear-gradient(135deg, #262A1D 0%, #3a3f2c 100%); color: #ffffff; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; border: none; }
        .table-invoice td { font-size: 0.9rem; padding: 12px 16px; border-bottom: 1px solid #e8e6dc; }
        .summary-box { background: #fbfbfa; border: 1px solid #e8e6dc; border-radius: 8px; padding: 20px; }
        .payment-box { background: #f4f3ed; border-left: 4px solid #E3A857; border-radius: 4px; padding: 16px; margin-top: 30px; }
        @media print {
            body { background: #ffffff !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            img, .print-logo { display: inline-block !important; max-height: 75px !important; visibility: visible !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .invoice-card, .excel-invoice-wrapper, .word-invoice-wrapper { border: none !important; box-shadow: none !important; margin: 0 !important; max-width: 100% !important; padding: 0 !important; }
            .excel-invoice-table { width: 100% !important; border-collapse: collapse !important; }
            .excel-invoice-table td { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

<div class="container py-3 no-print">
    <div class="d-flex justify-content-between align-items-center max-width-860 mx-auto" style="max-width: 860px;">
        <a th:href="@{/tenant/invoices/builder}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Back to Invoice Studio
        </a>
        <button onclick="window.print()" class="btn btn-primary btn-sm px-4">
            <i class="bi bi-printer me-1"></i> Print / Download PDF
        </button>
    </div>
</div>

<div class="invoice-card p-4 bg-white rounded shadow-sm border" th:if="${customInvoiceHtml != null}">
    <div th:utext="${customInvoiceHtml}"></div>
</div>

<div class="invoice-card" th:if="${customInvoiceHtml == null && invoice != null}">
    <!-- Header -->
    <div class="invoice-header d-flex justify-content-between align-items-start">
        <div class="d-flex align-items-center gap-3">
            <img th:src="@{/images/logo.png}" alt="Logo" class="print-logo" style="height: 55px; width: auto; object-fit: contain; display: inline-block;">
            <div>
                <div class="brand-badge mb-1">ENTERPRISE SUITE</div>
                <h2 class="mb-0 font-weight-bold text-dark" th:text="${invoice.tenant != null ? invoice.tenant.name : 'Business Name'}">Business Name</h2>
                <p class="text-muted small mb-0" th:text="${billingAccount != null ? billingAccount.billingAddress : 'Official Commercial Enterprise'}">Commercial Address</p>
            </div>
        </div>
        <div class="text-end">
            <h1 class="invoice-title mb-1">TAX INVOICE</h1>
            <div class="badge fs-6 mb-2"
                 th:classappend="${invoice.status.name() == 'PAID' ? 'bg-success' : (invoice.status.name() == 'OVERDUE' ? 'bg-danger' : 'bg-warning text-dark')}"
                 th:text="${invoice.status}">
                PAID
            </div>
            <p class="small text-muted mb-0"><strong class="text-dark">Invoice #:</strong> <span th:text="${invoice.invoiceNumber}">INV-001</span></p>
            <p class="small text-muted mb-0"><strong class="text-dark">Issue Date:</strong> <span th:text="${invoice.issueDate}">2026-08-01</span></p>
            <p class="small text-muted mb-0"><strong class="text-dark">Due Date:</strong> <span th:text="${invoice.dueDate}">2026-08-31</span></p>
        </div>
    </div>
</div>

</body>
</html>
