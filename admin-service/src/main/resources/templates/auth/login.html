<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>

<body class="login-page">
<main class="login-shell">
    <section class="login-panel">
        <div class="login-brand d-flex align-items-center gap-3 mb-4">
            <img th:src="@{/images/logo.png}" alt="Mbhoni Creative Logo" class="brand-logo shadow-sm" style="height: 48px; width: 48px; border-radius: 10px; object-fit: cover; border: 1px solid rgba(255,255,255,0.2);">
            <div>
                <h1 class="mb-0 fw-bold fs-3" style="letter-spacing: 0.5px;">MBHONI</h1>
                <p class="text-muted mb-0" style="font-size: 0.82rem;">Creative Enterprise Suite</p>
            </div>
        </div>

        <form th:action="@{/login}" method="post" class="login-form">
            <div th:if="${param.error}" class="alert alert-danger">
                Invalid username or password.
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                You have been signed out.
            </div>

            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>

            <label class="form-label mt-3">Password</label>
            <input type="password" name="password" class="form-control" required>

            <button class="btn btn-primary w-100 mt-4" type="submit">
                Sign in
            </button>

            <div class="text-center my-3 text-muted fs-7">OR</div>

            <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2">
                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
                Sign in with Google
            </a>
        </form>
    </section>
</main>
</body>
</html>
