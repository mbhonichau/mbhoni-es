<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - MBHONI Creative Enterprise</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.css}">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: #dfddd1;
            color: #dfddd1;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .login-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(38, 42, 29, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 42px 45px;
            border-radius: 20px;
            border: 1.5px solid rgba(223, 221, 209, 0.25);
            width: 90%;
            max-width: 440px;
            box-shadow: 0 0 80px rgba(113, 53, 25, 0.3), inset 0 0 40px rgba(223, 221, 209, 0.05);
            z-index: 10;
            animation: glowPulse 3.5s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 70px rgba(113, 53, 25, 0.25), inset 0 0 40px rgba(223, 221, 209, 0.05); }
            50% { box-shadow: 0 0 110px rgba(113, 53, 25, 0.45), inset 0 0 60px rgba(223, 221, 209, 0.1); }
        }

        .login-brand-title {
            color: #ffffff;
            margin-bottom: 2px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ffffff, #dfddd1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-brand-subtitle {
            color: #dfddd1;
            opacity: 0.85;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #dfddd1;
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(223, 221, 209, 0.08);
            border: 1.5px solid rgba(223, 221, 209, 0.25);
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            background: rgba(223, 221, 209, 0.14);
            border-color: #713519;
            box-shadow: 0 0 25px rgba(113, 53, 25, 0.4);
        }

        .form-group input::placeholder {
            color: rgba(223, 221, 209, 0.45);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #713519 0%, #994d1c 100%);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            box-shadow: 0 0 35px rgba(113, 53, 25, 0.45);
        }

        .login-btn:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #853e1e 0%, #ad5821 100%);
            box-shadow: 0 0 50px rgba(113, 53, 25, 0.65);
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: rgba(223, 221, 209, 0.08);
            border: 1.5px solid rgba(223, 221, 209, 0.25);
            border-radius: 10px;
            color: #dfddd1;
            font-size: 14px;
            font-weight: 650;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .google-btn:hover {
            background: rgba(223, 221, 209, 0.16);
            color: #ffffff;
            border-color: #dfddd1;
        }
    </style>
</head>

<body>
<canvas id="canvas"></canvas>

<div class="login-container text-center">
    <div class="d-flex align-items-center justify-content-center gap-3 mb-4">
        <img th:src="@{/images/logo.png}" alt="Mbhoni Creative Logo" style="height: 48px; width: 44px; object-fit: cover; border-radius: 8px;">
        <div class="text-start">
            <h1 class="login-brand-title">MBHONI</h1>
            <p class="login-brand-subtitle">Creative Enterprise</p>
        </div>
    </div>

    <form th:action="@{/login}" method="post" id="loginForm">
        <div th:if="${param.error}" class="alert alert-danger py-2 mb-3" style="font-size: 0.85rem;">
            Invalid username or password.
        </div>

        <div th:if="${param.logout}" class="alert alert-success py-2 mb-3" style="font-size: 0.85rem;">
            You have been signed out.
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="login-btn">Sign In</button>

        <div class="text-center my-3 text-muted fs-7" style="color: #dfddd1 !important; opacity: 0.6;">OR</div>

        <a th:href="@{/oauth2/authorization/google}" class="google-btn">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
            Sign in with Google
        </a>
    </form>
</div>

<!-- Three.js 3D Canvas Background Engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    // 3D Scene Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true, alpha: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x171a12);
    renderer.shadowMap.enabled = true;
    camera.position.z = 25;

    // Concentric Tube Rings Group
    const tubeGroup = new THREE.Group();
    scene.add(tubeGroup);

    function createTubeRing(radius, depth, rotation = 0) {
        const points = [];
        const segments = 64;

        for (let i = 0; i < segments; i++) {
            const angle = (i / segments) * Math.PI * 2;
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;
            points.push(new THREE.Vector3(x, y, 0));
        }
        points.push(points[0]);

        const curve = new THREE.CatmullRomCurve3(points);
        const tubeGeometry = new THREE.TubeGeometry(curve, segments, 0.8, 8, true);

        // Custom Warm Earthy Palette Materials (#713519 Terracotta & #454F2C Sage)
        const material = new THREE.MeshPhongMaterial({
            color: new THREE.Color(i % 2 === 0 ? 0x713519 : 0x454f2c),
            emissive: new THREE.Color(i % 2 === 0 ? 0x3d1c0d : 0x242a17),
            shininess: 90,
            wireframe: false
        });

        const tube = new THREE.Mesh(tubeGeometry, material);
        tube.castShadow = true;
        tube.receiveShadow = true;
        tube.position.z = depth;
        tube.rotation.z = rotation;

        return tube;
    }

    // Create 15 concentric tube rings
    for (let i = 0; i < 15; i++) {
        const tube = createTubeRing(8 + i * 1.5, -50 + i * 7, i * 0.1);
        tubeGroup.add(tube);
    }

    // Spinning particles group
    const particleGroup = new THREE.Group();
    scene.add(particleGroup);

    const particleGeometry = new THREE.IcosahedronGeometry(0.3, 2);

    for (let i = 0; i < 300; i++) {
        const isRust = Math.random() > 0.5;
        const material = new THREE.MeshPhongMaterial({
            color: new THREE.Color(isRust ? 0x713519 : 0x454f2c),
            emissive: new THREE.Color(isRust ? 0x4a2310 : 0x2b321c),
            shininess: 80
        });

        const particle = new THREE.Mesh(particleGeometry, material);
        const angle = Math.random() * Math.PI * 2;
        const radius = 5 + Math.random() * 8;

        particle.position.set(
            Math.cos(angle) * radius,
            Math.sin(angle) * radius,
            -40 + Math.random() * 80
        );

        particle.scale.set(Math.random() * 0.6 + 0.3, Math.random() * 0.6 + 0.3, Math.random() * 0.6 + 0.3);
        particle.castShadow = true;
        particle.velocity = { z: Math.random() * 0.3 + 0.1 };

        particleGroup.add(particle);
    }

    // Brand Palette Lights
    const light1 = new THREE.PointLight(0x713519, 2.5, 200); // Terracotta Rust
    light1.position.set(20, 20, 20);
    scene.add(light1);

    const light2 = new THREE.PointLight(0x454f2c, 2.5, 200); // Sage Green
    light2.position.set(-20, -20, 20);
    scene.add(light2);

    const light3 = new THREE.PointLight(0xdfddd1, 1.8, 150); // Warm Sand
    light3.position.set(0, 30, -30);
    scene.add(light3);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    // Interactive Mouse Tracking
    let mouseX = 0;
    let mouseY = 0;
    document.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    let time = 0;

    // Animation Loop
    function animate() {
        requestAnimationFrame(animate);
        time += 0.001;

        tubeGroup.rotation.z += 0.0005;
        tubeGroup.position.z += 0.05;
        if (tubeGroup.position.z > 100) tubeGroup.position.z = -100;

        particleGroup.children.forEach((particle) => {
            particle.position.z += particle.velocity.z;
            particle.rotation.x += 0.005;
            particle.rotation.y += 0.008;

            if (particle.position.z > 50) {
                particle.position.z = -100;
            }
        });

        light1.position.x = 20 + Math.sin(time * 2) * 10;
        light1.position.y = 20 + Math.cos(time * 1.5) * 10;

        light2.position.x = -20 + Math.cos(time * 1.8) * 10;
        light2.position.y = -20 + Math.sin(time * 2.2) * 10;

        camera.position.x += (mouseX * 3 - camera.position.x) * 0.08;
        camera.position.y += (mouseY * 3 - camera.position.y) * 0.08;
        camera.lookAt(0, 0, 0);

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
