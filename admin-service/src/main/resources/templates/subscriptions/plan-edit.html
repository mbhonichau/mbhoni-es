<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Edit Plan')}"></head>

<body>
<div class="admin-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="admin-main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <main class="admin-content">
            <section class="page-heading">
                <div>
                    <p class="eyebrow">Subscriptions</p>
                    <h2>Edit Plan</h2>
                    <p class="text-muted mb-0" th:text="${plan.name}">Plan name</p>
                </div>

                <a th:href="@{/subscriptions/plans}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i>
                    Back
                </a>
            </section>

            <section class="form-panel">
                <form th:action="@{/subscriptions/plans/update}" th:object="${plan}" method="post">
                    <input type="hidden" name="id" th:value="${plan.id}">

                    <div th:replace="~{subscriptions/plan-form :: fields}"></div>

                    <div class="form-actions">
                        <a th:href="@{/subscriptions/plans}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check2"></i>
                            Save Changes
                        </button>
                    </div>
                </form>
            </section>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
