<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Plan Modules')}"></head>

<body>
<div class="admin-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="admin-main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <main class="admin-content">
            <section class="page-heading">
                <div>
                    <p class="eyebrow">Subscriptions</p>
                    <h2>Plan Modules Entitlement</h2>
                    <p class="text-muted mb-0" th:text="'Configure modules licensed for plan: ' + ${plan.name}">Plan</p>
                </div>

                <a th:href="@{/subscriptions/plans}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
            </section>

            <section class="form-panel">
                <form th:action="@{/subscriptions/plans/modules/update}" method="post">
                    <input type="hidden" name="id" th:value="${plan.id}">

                    <div class="module-hub-grid mb-4">
                        <div class="module-card-v2" th:each="module : ${modules}">
                            <div>
                                <div class="module-card-header">
                                    <div class="module-icon-box" th:classappend="${module.allowed ? 'green' : ''}">
                                        <i class="bi bi-boxes"></i>
                                    </div>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input"
                                               type="checkbox"
                                               name="allowedModuleIds"
                                               th:value="${module.moduleId}"
                                               th:checked="${module.allowed}">
                                    </div>
                                </div>

                                <div class="module-card-body">
                                    <h6 th:text="${module.name}">Module Name</h6>
                                    <span class="badge bg-secondary mb-2" th:text="${module.category}">Category</span>
                                    <p th:text="${module.description != null ? module.description : 'Commercial tier module capability.'}">Description</p>
                                </div>
                            </div>

                            <div class="module-card-footer">
                                <div>
                                    <span th:if="${module.allowed}" class="badge bg-success">Licensed</span>
                                    <span th:unless="${module.allowed}" class="badge bg-secondary">Blocked</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/subscriptions/plans}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check2 me-1"></i> Save Plan Module Entitlements
                        </button>
                    </div>
                </form>
            </section>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
