<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Plan Modules')}"></head>

<body>
<div class="admin-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="admin-main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <main class="admin-content">
            <section class="page-heading">
                <div>
                    <p class="eyebrow">Subscriptions</p>
                    <h2>Plan Modules</h2>
                    <p class="text-muted mb-0" th:text="${plan.name}">Plan</p>
                </div>

                <a th:href="@{/subscriptions/plans}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i>
                    Back
                </a>
            </section>

            <section class="form-panel">
                <form th:action="@{/subscriptions/plans/modules/update}" method="post">
                    <input type="hidden" name="id" th:value="${plan.id}">

                    <div class="module-grid">
                        <label class="module-card" th:each="module : ${modules}">
                            <input type="checkbox"
                                   name="allowedModuleIds"
                                   th:value="${module.moduleId}"
                                   th:checked="${module.allowed}">

                            <span class="module-icon">
                                <i class="bi bi-grid"></i>
                            </span>

                            <span>
                                <strong th:text="${module.name}">Module</strong>
                                <small th:text="${module.category}">Category</small>
                                <p th:text="${module.description}">Description</p>

                                <em th:if="${module.allowed}" class="status-pill active">Allowed</em>
                                <em th:unless="${module.allowed}" class="status-pill inactive">Blocked</em>
                            </span>
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check2"></i>
                            Save Plan Modules
                        </button>
                    </div>
                </form>
            </section>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
