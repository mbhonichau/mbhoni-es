spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        native:
          search-locations: file:/app/config
  profiles:
    active: native

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: liveness
        readiness:
          include: readiness
      validate-group-membership: false
  endpoints:
    web:
      exposure:
        include: health,info,liveness,readiness
